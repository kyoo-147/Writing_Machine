[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-content-machine"
version = "0.3.0"
description = "Chat-first AI news research, verification, production and publishing pipeline."
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]
oauth = ["keyring>=25.0"]
dashboard = []
dev = ["pytest>=8.0"]

[project.scripts]
content-machine = "content_machine.cli:main"

[tool.setuptools.packages.find]
include = ["content_machine*"]
